# Weekly off-site backup of the Supabase database + Storage files, encrypted.
# Independent of Supabase's own backups (those vanish with the project / plan).
#
# Repo secrets (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL            Dashboard → Connect → Session pooler URI (with the DB password)
#   SUPABASE_URL               https://gzcewdhjlykwqhtjludv.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY  Dashboard → Settings → API keys (secret)
#   BACKUP_PASSPHRASE          long random string — store it in your password manager too,
#                              without it the backups cannot be decrypted
# Restore: see BACKUP-RESTORE.md.
name: backup

on:
  schedule:
    - cron: '0 2 * * 1' # Mondays 02:00 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dump database (roles, schema, data)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p backup/db
          supabase db dump --db-url "$DB_URL" -f backup/db/roles.sql --role-only
          supabase db dump --db-url "$DB_URL" -f backup/db/schema.sql
          supabase db dump --db-url "$DB_URL" -f backup/db/data.sql --use-copy --data-only

      - name: Download Storage files
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npm ci --ignore-scripts --omit=dev
          node scripts/backup-storage.mjs backup backup/storage

      - name: Encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$BACKUP_PASSPHRASE"
          name="adlr-backup-$(date -u +%Y-%m-%d)"
          tar -czf "$name.tar.gz" backup
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
              --symmetric --cipher-algo AES256 -o "$name.tar.gz.gpg" "$name.tar.gz"
          rm -rf backup "$name.tar.gz"
          echo "NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tar.gz.gpg
          retention-days: 90
