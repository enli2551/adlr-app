# Codemagic CI — builds the ADLR iOS app on a cloud macOS machine (no Mac needed).
# Capacitor 8 iOS uses Swift Package Manager (no CocoaPods), so the build target
# is the Xcode PROJECT (ios/App/App.xcodeproj), scheme "App".
#
# One-time setup in the Codemagic UI (codemagic.io):
#   1. Connect this repo.
#   2. Integrations → App Store Connect: add an App Store Connect API key
#      (Apple Developer Program required, $99/yr). Name it e.g. "ADLR_ASC".
#   3. Register the bundle id com.adlr.app in your Apple Developer account
#      (Codemagic can auto-create it with automatic code signing).
# Then push to the repo (or run manually) — the .ipa lands in TestFlight.

workflows:
  ios-release:
    name: ADLR iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    # App Store Connect API key integration configured in the Codemagic UI.
    # NOTE: `integrations` is a workflow-level key (sibling of `environment`).
    integrations:
      app_store_connect: ADLR_ASC
    environment:
      node: 22
      xcode: latest
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.adlr.app"
        WIDGET_BUNDLE_ID: "com.adlr.app.RestTimer"
      # Set this env group in the Codemagic UI:
      #   - "supabase": VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY (Vite inlines them at build time)
      #   - "ios_signing": CERTIFICATE_PRIVATE_KEY (secure) — ONE fixed RSA key for the
      #     distribution certificate. A fresh key per build made a new certificate every
      #     run until Apple's limit was hit (409 "You already have a current Distribution
      #     certificate", 2026-10-20). With a fixed key the certificate is reused.
      groups:
        - supabase
        - ios_signing
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Write .env from CI variables (Supabase)
        script: |
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" > .env
          echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY" >> .env
      - name: Build web assets (Vite)
        script: npx vite build
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Set up code signing
        script: |
          set -ex
          keychain initialize
          # The fixed private key of the distribution certificate (env group "ios_signing").
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "CERTIFICATE_PRIVATE_KEY missing: add it to the ios_signing env group" >&2; exit 1
          fi
          # Stored as ONE base64 line (pasting a multi-line PEM into the UI loses the
          # line breaks); a plain PEM still works.
          set +x
          case "$CERTIFICATE_PRIVATE_KEY" in
            *BEGIN*) printf '%s\n' "$CERTIFICATE_PRIVATE_KEY" > /tmp/adlr_cert_key.pem ;;
            *) printf '%s' "$CERTIFICATE_PRIVATE_KEY" | tr -d ' \r\n' | base64 --decode > /tmp/adlr_cert_key.pem ;;
          esac
          if ! openssl rsa -check -noout -in /tmp/adlr_cert_key.pem >/dev/null 2>&1; then
            echo "CERTIFICATE_PRIVATE_KEY is not a valid RSA key (paste the one-line base64 value)" >&2; exit 1
          fi
          set -x
          # Reuse the certificate made from that key (created on the first run only) and
          # create/download the App Store provisioning profile for the bundle id.
          # PUSH (2026-10): App.entitlements has aps-environment. Enable "Push Notifications"
          # on the com.adlr.app App ID (done 2026-10-18); --create makes a fresh profile on
          # every run, which then contains the push entitlement. See PUSH-SETUP.md.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/adlr_cert_key.pem \
            --create
          # Live Activity widget extension (RestTimerWidget) has its own bundle id and
          # App Store profile. Register the id if it doesn't exist yet (fails harmlessly
          # when it already does), then fetch its profile with the SAME certificate key.
          app-store-connect bundle-ids create "$WIDGET_BUNDLE_ID" --name "ADLR Rest Timer" --platform IOS || true
          app-store-connect fetch-signing-files "$WIDGET_BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/adlr_cert_key.pem \
            --create
          keychain add-certificates
          # Wire the downloaded profiles (app + widget) into the Xcode project (manual signing).
          xcode-project use-profiles
      - name: Build .ipa
        script: |
          set -ex
          # Use a Unix timestamp as the build number so every upload is unique
          # and strictly increasing (no more "bundle version already used").
          BUILD_NO=$(date +%s)
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags "CURRENT_PROJECT_VERSION=$BUILD_NO"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload to TestFlight only; internal testers get it immediately.
        # External beta-review submission is done manually in App Store Connect
        # (avoids post-processing failures while iterating).
        submit_to_testflight: false

  # ── FREE pre-check: compiles the iOS app on a cloud Mac WITHOUT an Apple
  # Developer account or code signing (builds for the simulator). Use this to
  # confirm the app builds before paying for the Apple Developer Program.
  ios-verify:
    name: ADLR iOS (compile check, no signing)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: 22
      xcode: latest
      groups:
        - supabase
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Write .env from CI variables (Supabase)
        script: |
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" > .env
          echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY" >> .env
      - name: Build web assets (Vite)
        script: npx vite build
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Compile for simulator (no signing)
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - /tmp/xcodebuild_logs/*.log
